name: wheels

# Two distributions: cudaq-pulse, and cudaq-pulse-tools (the cudaq-pulse-opt
# MLIR driver), which it requires at its own version
# (packaging/cudaq-pulse-tools), one py3-none wheel per platform. Linux
# cudaq-pulse wheels include the GPU runtime; macOS wheels are compiler-only.
# Both distributions are tested by cibuildwheel (see [tool.cibuildwheel] in
# each pyproject.toml), then installed together from the built wheels and
# tested again on clean systems without a CUDA toolkit.
# Every file of a run has the version the version job picks. Once all tests
# pass, the dist job checks the complete set (tools/check-dist.py) and uploads
# it as the run's one artifact for upload, cudaq-pulse-<version>-dist: dist/
# with exactly the files to upload, and SHA256SUMS and MANIFEST.json beside
# it. The per-platform intermediate-* artifacts only feed the jobs of the run.
# A v* tag publishes a GitHub release with that bundle, after release-meta
# checks the tag and gpu-gate confirms GPU verification, and then, once
# enabled, uploads its wheels to TestPyPI (pre-releases) or PyPI (see the end
# of this file); the sdist stays on the GitHub release.
#
# GPU gate: with the GPU_RUNNERS repository variable set, a tag runs
# gpu-install-test on the GPU runners and publishes only if it passes. Without
# runners, the tag's run stops at gpu-gate; once the GPU tests have passed on
# the tagged commit elsewhere, a maintainer runs this workflow manually on
# the tag with `gpu-verified-sha` set to that commit's full SHA (see
# CONTRIBUTING.md). A GPU run that fails cannot be overridden.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      gpu:
        description: Also run every GPU test row on the GPU runners
        type: boolean
        default: false
      gpu-verified-sha:
        description: >
          Releases without a GPU runner only: the full SHA of the tagged
          commit, confirming that the GPU tests passed on it
        type: string
        default: ""
      version:
        description: >
          Rehearse a release on a branch: build every file as this version
          (X.Y.Z, X.Y.Z.postN or X.Y.Z{a,b,rc}N); nothing is published
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The version of every file of the run: on a v* tag the tag's
  # (release-meta.py), on a manual run with `version` that version, and
  # otherwise the dev version setuptools-scm gives the commit (X.Y.Z.devN, no
  # local segment; see [tool.setuptools_scm] in pyproject.toml). Only a
  # rehearsal pins the builds to it, through setuptools-scm's
  # SETUPTOOLS_SCM_PRETEND_VERSION_FOR_<DISTRIBUTION>; other builds derive the
  # same version from git, and the dist job checks that they did.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      kind: ${{ steps.version.outputs.kind }}
      pretend: ${{ steps.version.outputs.pretend }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REHEARSAL: ${{ inputs.version }}
        run: |
          pretend=""
          if [[ "$REF_TYPE" == tag && "$REF_NAME" == v* ]]; then
            if [[ -n "$REHEARSAL" ]]; then
              echo "::error::a run on tag $REF_NAME builds the tag's version; leave version empty"
              exit 1
            fi
            version="$(python3 tools/release-meta.py "$REF_NAME")"
            kind=release
            artifact="cudaq-pulse-$version-dist"
          elif [[ -n "$REHEARSAL" ]]; then
            version="$(python3 tools/release-meta.py "v$REHEARSAL")"
            kind=rehearsal
            pretend="$version"
            artifact="cudaq-pulse-$version-rehearsal-dist"
          else
            version="$(uv run --no-project --with 'setuptools-scm>=9' python -m setuptools_scm)"
            kind=dev
            artifact="cudaq-pulse-$version-dist"
          fi
          echo "::notice::$kind build of version $version, artifact $artifact"
          {
            echo "version=$version"
            echo "kind=$kind"
            echo "pretend=$pretend"
            echo "artifact=$artifact"
          } >> "$GITHUB_OUTPUT"

  wheels:
    name: wheels (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    # Empty, and so ignored, unless the run is a rehearsal. On Linux,
    # environment-pass in each pyproject.toml hands them to the container.
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CUDAQ_PULSE: ${{ needs.version.outputs.pretend }}
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CUDAQ_PULSE_TOOLS: ${{ needs.version.outputs.pretend }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos-aarch64, runner: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # On Linux the archive is unpacked inside the manylinux container by
      # tools/ci/manylinux-before-all.sh; on macOS the build runs on the host.
      - uses: ./.github/actions/mlir-toolchain
        with:
          unpack: ${{ runner.os == 'macOS' }}

      # cudaq-pulse-tools first: the cudaq-pulse tests install it from
      # tools-wheelhouse/ (before-test in pyproject.toml).
      - name: Build the cudaq-pulse-tools wheel
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: packaging/cudaq-pulse-tools
          output-dir: tools-wheelhouse

      - name: Build the cudaq-pulse wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5

      - name: Gather both distributions' wheels
        run: cp tools-wheelhouse/*.whl wheelhouse/

      # PyPI rejects files over 100 MiB unless the project has a raised limit.
      - name: Check wheel sizes
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'EOF'
          import os, pathlib, sys
          limit_mib = 90
          rows, oversized = [], []
          for wheel in sorted(pathlib.Path("wheelhouse").glob("*.whl")):
              mib = wheel.stat().st_size / (1024 * 1024)
              rows.append(f"| `{wheel.name}` | {mib:.1f} |")
              if mib > limit_mib:
                  oversized.append(wheel.name)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Wheel sizes ({os.environ['PLATFORM']}), limit {limit_mib} MiB\n\n")
              summary.write("| wheel | MiB |\n|---|---:|\n" + "\n".join(rows) + "\n")
          print("\n".join(rows))
          for name in oversized:
              print(f"::error::{name} exceeds {limit_mib} MiB")
          sys.exit(1 if oversized or not rows else 0)
          EOF

      - name: Check wheel contents, licenses and metadata
        run: |
          python3 tools/check-wheel-contents.py wheelhouse/*.whl
          pipx run --spec 'twine>=6' twine check --strict wheelhouse/*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intermediate-wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CUDAQ_PULSE: ${{ needs.version.outputs.pretend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build --sdist
      - name: Check the sdist's licenses and metadata
        run: |
          python3 tools/check-wheel-contents.py dist/*.tar.gz
          uvx --from 'twine>=6' twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intermediate-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Installs the wheels into images that have no CUDA toolkit, the way users
  # will: rockylinux:8 is the manylinux_2_28 glibc floor, ubuntu:24.04 uses its
  # system Python, and the [cu12]/[cu13] extras must load without a GPU. The
  # 3.14t rows install the free-threaded wheel on the runner itself.
  install-test:
    name: install-test (${{ matrix.platform }}, ${{ matrix.image || matrix.runner }})
    needs: wheels
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "python:3.12-slim", python: python3 }
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "python:3.14-slim", python: python3 }
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "python:3.15-slim", python: python3 }
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "ubuntu:24.04", python: python3 }
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "rockylinux:8", python: python3.12 }
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "", python: python3.14t, python-version: "3.14t" }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "python:3.12-slim", python: python3 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "python:3.14-slim", python: python3 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "python:3.15-slim", python: python3 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "ubuntu:24.04", python: python3 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "rockylinux:8", python: python3.12 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "", python: python3.14t, python-version: "3.14t" }
          - { platform: macos-aarch64, runner: macos-15, image: "", python: python3, python-version: "3.12" }
          - { platform: macos-aarch64, runner: macos-15, image: "", python: python3, python-version: "3.14" }
          - { platform: macos-aarch64, runner: macos-15, image: "", python: python3.14t, python-version: "3.14t" }
    steps:
      # The package servers can be out of a runner's reach for minutes. With
      # the apt.conf.d line, every apt-get retries a failed download up to 5
      # times (3 by default).
      - name: Install Python (ubuntu:24.04)
        if: matrix.image == 'ubuntu:24.04'
        run: |
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-pip python3-venv
      - name: Install Python (rockylinux:8)
        if: matrix.image == 'rockylinux:8'
        run: dnf install -y python3.12 python3.12-pip
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.python-version
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intermediate-wheels-${{ matrix.platform }}
          path: wheelhouse

      - name: Install and test cudaq-pulse
        run: bash tools/ci/install-test.sh --python "${{ matrix.python }}" base

      # The pass plugin builds against the MLIR toolchain and a host compiler,
      # so only on the runners themselves.
      - uses: ./.github/actions/mlir-toolchain
        if: matrix.image == ''
        with:
          unpack: true
      - name: Load the example pass plugin into the installed cudaq-pulse-opt
        if: matrix.image == ''
        run: bash tools/ci/install-test.sh --python "${{ matrix.python }}" plugin

      - name: Install the [cu12] and [cu13] extras without a GPU
        if: runner.os == 'Linux'
        run: bash tools/ci/install-test.sh --python "${{ matrix.python }}" extras

  # The GPU tests from the wheels (gpu-tests.yml), once the GPU_RUNNERS
  # repository variable names the GPU runners: the quick rows on pushes to
  # main, every row on release tags and on manual runs with
  # `gpu`. Each row installs one CUDA extra in an image with no CUDA
  # toolkit, since the extras supply every library. Pull requests never
  # reach it.
  gpu-install-test:
    if: >-
      vars.GPU_RUNNERS != '' &&
      (github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v') || inputs.gpu)
    needs: wheels
    uses: ./.github/workflows/gpu-tests.yml
    with:
      source: wheels
      scope: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && 'full' || 'quick' }}

  # The run's one artifact for upload, once every test has passed: dist/ with
  # exactly the files a release uploads (both distributions' wheels for every
  # platform and the sdist), checked by tools/check-dist.py against the
  # version job's version (a release version for a tag or rehearsal, a dev
  # version otherwise; no local version, both distributions and the sdist
  # alike, twine check --strict, sizes, license files), with SHA256SUMS and
  # MANIFEST.json beside it. The release jobs upload exactly these files.
  dist:
    needs: [version, wheels, sdist, install-test, gpu-install-test]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      needs.wheels.result == 'success' && needs.sdist.result == 'success' &&
      needs.install-test.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.gpu-install-test.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact: ${{ needs.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: intermediate-*
          path: bundle/dist
          merge-multiple: true
      - name: Check the files and write SHA256SUMS and MANIFEST.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
          KIND: ${{ needs.version.outputs.kind }}
          ARTIFACT: ${{ needs.version.outputs.artifact }}
        run: |
          flags=(--write-sums)
          [[ "$KIND" == dev ]] || flags+=(--release)
          {
            echo "### \`$ARTIFACT\` ($KIND build)"
            echo
            uv run --no-project --with 'twine>=6' \
              python tools/check-dist.py --version "$VERSION" "${flags[@]}" bundle
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.version.outputs.artifact }}
          path: bundle/
          if-no-files-found: error

  # A release publishes only after GPU verification: gpu-install-test passed
  # in this run, or, when it did not run, a maintainer attested on a manual
  # run that the GPU tests passed on exactly this commit.
  gpu-gate:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: gpu-install-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.gpu-install-test.result }}
          EVENT: ${{ github.event_name }}
          ATTESTED_SHA: ${{ inputs.gpu-verified-sha }}
        run: |
          case "$RESULT" in
            success)
              echo "GPU verification: gpu-install-test passed on $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            skipped) ;;
            *)
              echo "::error::gpu-install-test $RESULT; a failed GPU run cannot be attested away"
              exit 1 ;;
          esac
          if [[ "$EVENT" == workflow_dispatch && "$ATTESTED_SHA" == "$GITHUB_SHA" ]]; then
            echo "::notice::GPU verification of $GITHUB_SHA attested by $GITHUB_ACTOR"
            echo "GPU verification: attested by @$GITHUB_ACTOR for $GITHUB_SHA (no GPU runner)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::no GPU verification for $GITHUB_SHA: set the GPU_RUNNERS variable, or run" \
            "this workflow on the tag with gpu-verified-sha=$GITHUB_SHA after the GPU tests pass" \
            "(CONTRIBUTING.md, Releases)"
          exit 1

  # Checks a v* tag before anything is released: it must name a PEP 440
  # version that the setuptools-scm tag_regex accepts, a final version must be
  # reachable from main, CHANGELOG.md must have its notes, and the release
  # must not exist yet.
  release-meta:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(python3 tools/release-meta.py "$TAG")"
          prerelease="$(python3 tools/release-meta.py --prerelease "$TAG")"
          if [[ "$prerelease" == false ]] &&
             ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::final release tag $TAG is not on main"
            exit 1
          fi
          python3 tools/release-notes.py "$version" > /dev/null
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; release assets are write-once"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # A draft is created with the notes from CHANGELOG.md, the dist job's
  # bundle is checked against the tag and its SHA256SUMS, its files get signed
  # build-provenance attestations and are uploaded once with SHA256SUMS and
  # MANIFEST.json, and only then is the release published. Nothing is
  # overwritten. Verify a download with
  # `gh attestation verify <file> --repo NVIDIA/cudaq-pulse`.
  github-release:
    needs: [release-meta, dist, gpu-gate]
    # gpu-gate runs after a skipped job, which would skip this one by default;
    # require every direct dependency to have passed instead. dist ran only if
    # the builds and every install test passed.
    if: >-
      !cancelled() && needs.release-meta.result == 'success' &&
      needs.dist.result == 'success' && needs.gpu-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.dist.outputs.artifact }}
          path: bundle
      - name: Check the bundle against the tag
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          uv run --no-project --with 'twine>=6' \
            python tools/check-dist.py --version "$VERSION" --release --verify-sums bundle
      - name: Attest the build provenance of the wheels and the sdist
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bundle/dist/*
      - name: Create a draft, upload once, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.release-meta.outputs.prerelease }}
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          # The notes are the changelog's section for this version.
          python3 tools/release-notes.py "$VERSION" > "$RUNNER_TEMP/notes.md"
          flags=(--draft --verify-tag --title "cudaq-pulse ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md")
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}"
          # cudaq-pulse-tools first, as cudaq-pulse requires it.
          gh release upload "$TAG" bundle/dist/cudaq_pulse_tools-*.whl
          gh release upload "$TAG" bundle/dist/*.tar.gz bundle/dist/cudaq_pulse-*.whl
          gh release upload "$TAG" bundle/SHA256SUMS bundle/MANIFEST.json
          gh release edit "$TAG" --draft=false

  # Once the GitHub release is published, its wheels go to a package index by
  # trusted publishing, with no API token: a pre-release (vX.Y.Z{a,b,rc}N) to
  # TestPyPI, any other release to PyPI. Each index trusts this workflow only
  # in its own environment, `testpypi` or `pypi`, whose protection rules
  # gate the upload, and both project names need a trusted publisher. GitHub
  # creates a missing environment without protection, so both jobs also stay
  # off until the PYPI_PUBLISHING repository variable is `true`, set once
  # the publishers and environments exist. They run only for a v* tag of
  # this repository; pushes to branches and manual runs on a branch never
  # reach them. The cudaq-pulse-tools wheels are uploaded first, so that
  # cudaq-pulse is never on the index without the cudaq-pulse-tools it pins;
  # a re-run skips the files already there. The wheels are exactly those in
  # dist/ of the bundle github-release checked and published, with their
  # SHA256SUMS checked again; the sdist stays on the GitHub release.
  testpypi:
    needs: [release-meta, dist, github-release]
    if: >-
      !cancelled() && vars.PYPI_PUBLISHING == 'true' &&
      github.repository == 'NVIDIA/cudaq-pulse' && startsWith(github.ref, 'refs/tags/v') &&
      needs.github-release.result == 'success' &&
      needs.release-meta.outputs.prerelease == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cudaq-pulse/${{ needs.release-meta.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.dist.outputs.artifact }}
          path: bundle
      - name: Check the bundle's digests and sort out the wheels to upload
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          (cd bundle && sha256sum --check --strict SHA256SUMS)
          diff <(cd bundle && printf '%s\n' dist/* | LC_ALL=C sort) \
            <(sed 's|^[0-9a-f]*  ||' bundle/SHA256SUMS | LC_ALL=C sort)
          shopt -s nullglob
          tools=(bundle/dist/cudaq_pulse_tools-"$VERSION"-*.whl)
          (( ${#tools[@]} )) || { echo "::error::no cudaq-pulse-tools wheels"; exit 1; }
          wheels=(bundle/dist/cudaq_pulse-"$VERSION"-*.whl)
          (( ${#wheels[@]} )) || { echo "::error::no cudaq-pulse wheels"; exit 1; }
          mkdir tools-dist wheels-dist
          mv "${tools[@]}" tools-dist/
          mv "${wheels[@]}" wheels-dist/
          # Only the sdist, which stays on the GitHub release, is left.
          for file in bundle/dist/*; do
            [[ "$file" == bundle/dist/cudaq_pulse-"$VERSION".tar.gz ]] ||
              { echo "::error::$file is not a cudaq-pulse $VERSION file"; exit 1; }
          done
          ls -l tools-dist wheels-dist
      - name: Publish cudaq-pulse-tools to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: tools-dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      - name: Publish cudaq-pulse to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheels-dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    needs: [release-meta, dist, github-release]
    if: >-
      !cancelled() && vars.PYPI_PUBLISHING == 'true' &&
      github.repository == 'NVIDIA/cudaq-pulse' && startsWith(github.ref, 'refs/tags/v') &&
      needs.github-release.result == 'success' &&
      needs.release-meta.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/cudaq-pulse/${{ needs.release-meta.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.dist.outputs.artifact }}
          path: bundle
      - name: Check the bundle's digests and sort out the wheels to upload
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          (cd bundle && sha256sum --check --strict SHA256SUMS)
          diff <(cd bundle && printf '%s\n' dist/* | LC_ALL=C sort) \
            <(sed 's|^[0-9a-f]*  ||' bundle/SHA256SUMS | LC_ALL=C sort)
          shopt -s nullglob
          tools=(bundle/dist/cudaq_pulse_tools-"$VERSION"-*.whl)
          (( ${#tools[@]} )) || { echo "::error::no cudaq-pulse-tools wheels"; exit 1; }
          wheels=(bundle/dist/cudaq_pulse-"$VERSION"-*.whl)
          (( ${#wheels[@]} )) || { echo "::error::no cudaq-pulse wheels"; exit 1; }
          mkdir tools-dist wheels-dist
          mv "${tools[@]}" tools-dist/
          mv "${wheels[@]}" wheels-dist/
          # Only the sdist, which stays on the GitHub release, is left.
          for file in bundle/dist/*; do
            [[ "$file" == bundle/dist/cudaq_pulse-"$VERSION".tar.gz ]] ||
              { echo "::error::$file is not a cudaq-pulse $VERSION file"; exit 1; }
          done
          ls -l tools-dist wheels-dist
      - name: Publish cudaq-pulse-tools to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: tools-dist/
          skip-existing: true
      - name: Publish cudaq-pulse to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheels-dist/
          skip-existing: true
