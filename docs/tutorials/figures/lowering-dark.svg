  <g>
   <rect x="14" y="34" width="163.5" height="74" rx="5" class="pv-stage pv-stage-drive"/>
   <text x="23" y="51" class="pv-title pv-drive-text">Pulse MLIR</text>
   <text x="23" y="66" class="pv-tiny pv-code">mlir(&quot;pulse&quot;)</text>
