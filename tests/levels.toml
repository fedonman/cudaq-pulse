# The level of each test that is not at level 1 (CONTRIBUTING.md, "Test
# levels"). `pytest --level N` runs the tests of level N and lower;
# `pytest --level-report` prints what this table and the markers add up to.
#
# A key is a test file; or `file::test`, or `file::test[parameter id]`, where
# `*` stands for any characters (a `*` itself cannot be asked for) and a test
# in a class is `Class::test`. The value is the reason, in one line. For one
# test the closest entry counts: its parameters, then the test, then its
# file; and of two as close, the one written without `*`. A file not named
# here is at level 1, and a [level1.tests] entry keeps a test at level 1 in a
# file that is not.
#
# A `level0` .. `level3` marker on a test, or a `pytestmark` in its file,
# counts before this table; when a file gets markers, its entries here go.
# tests/test_levels.py fails on an entry that names no test, on a test that
# has both a marker and an entry, and on a level 0 that grew past its cap.

# Level 0, contract: a failure means a wrong result for a user (schedule, IR,
# export, physics) or a broken written promise (public names, a shipped
# example runs, every Python version traces to the same IR). Fast, explicit.

